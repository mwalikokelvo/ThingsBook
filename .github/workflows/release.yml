# Builds and publishes a ThingsBook release.
#
# Start it from the Actions tab (Release > Run workflow, version 1.13.0) or with
#   gh workflow run release.yml -f version=1.13.0
# once main carries that version (python work/set-version.py 1.13.0 --release-notes, committed). The
# release and its tag v<version> are created at the end, on the commit that was built. Pushing a v* tag
# also runs it.
#
# The Android APK must be signed with the ORIGINAL key, or it cannot update the installed app (updating
# would need an uninstall, which deletes the on-device library). It is built only when these repository
# secrets hold that key (Settings > Secrets and variables > Actions); they are encrypted, never shown,
# and not given to pull requests from forks:
#   ANDROID_KEYSTORE_BASE64   base64 of thingsbook-release.jks
#   ANDROID_KEYSTORE_PASSWORD the keystore password (key alias "thingsbook")
# A private voice pack is never bundled here: the repository and its releases are public.
#
# The Windows EXE is built after the APK and does not hold the release back: if it fails, the release is
# published without it and says so.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; main must already carry it (for example 1.13.0)
        required: true
      allow_without_apk:
        description: Publish even if the Android signing secrets are missing (EXE only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ github.event.inputs.version || '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the upgrade test needs the previous release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the version
        shell: pwsh
        run: |
          $version = (Get-Content work/thingsbook-desktop/package.json -Raw | ConvertFrom-Json).version
          $wanted = if ($env:VERSION) { $env:VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($version -ne $wanted) { throw "This commit carries version $version, not $wanted. Run work/set-version.py $wanted --release-notes and commit first." }
          if ($env:GITHUB_REF_TYPE -ne 'tag' -and (git tag --list "v$wanted")) { throw "v$wanted is already released." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:HAS_KEYSTORE -ne 'true') {
            if ('${{ github.event.inputs.allow_without_apk }}' -ne 'true') { throw 'The ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are not set, so the APK cannot be signed. Nothing was published. Add them, or rerun with allow_without_apk.' }
            "::warning title=No Android signing key::The ANDROID_KEYSTORE_* secrets are not set; this release will have no APK."
          }

      - name: Browser test tools (Playwright and Chromium)
        run: |
          npm install --prefix work/test-tools --no-audit --no-fund playwright@1.63.0
          node work/test-tools/node_modules/playwright/cli.js install chromium
      - name: Previous release, for the upgrade test
        shell: pwsh
        run: |
          $previous = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -ne "v$env:VERSION" } | Select-Object -First 1
          if (-not $previous) { $previous = 'c740c89' }  # 1.12.5, the last release before tags
          git worktree add --detach "$env:RUNNER_TEMP\previous" $previous
          "THINGSBOOK_RELEASED_DIR=$env:RUNNER_TEMP\previous\outputs\ThingsBook" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Regression suite (Chromium tests must run)
        run: node work/run-tests.cjs --require-browser

      - name: Android APK (signed with the original key)
        if: env.HAS_KEYSTORE == 'true'
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not (Test-Path "$env:ANDROID_HOME\build-tools\35.0.0") -or -not (Test-Path "$env:ANDROID_HOME\platforms\android-35")) {
            $sdkmanager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
            (1..20 | ForEach-Object { 'y' }) | & $sdkmanager.FullName --sdk_root="$env:ANDROID_HOME" 'build-tools;35.0.0' 'platforms;android-35' | Out-Null
          }
          $signing = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force $signing | Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path $signing 'thingsbook-release.jks'), [Convert]::FromBase64String($env:KEYSTORE.Trim()))
            [IO.File]::WriteAllText((Join-Path $signing 'password.txt'), $env:KEYSTORE_PASSWORD)
            python work/build-apps.py android --jdk "$env:JAVA_HOME_17_X64" --sdk "$env:ANDROID_HOME" --signing "$signing" 2>&1 | Tee-Object -FilePath android.log
            if ($LASTEXITCODE -ne 0) {
              Get-Content android.log -Tail 15 | ForEach-Object { "::error title=Android build::$($_ -replace '%','%25' -replace '\r','')" }
              throw "Android build failed ($LASTEXITCODE)."
            }
          } finally { Remove-Item -Recurse -Force $signing }

      - name: Windows EXE
        id: windows
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location work/thingsbook-desktop; npm ci; if ($LASTEXITCODE) { throw 'npm ci failed' }; Pop-Location
          Push-Location core; cargo build --release --locked --bin thingsbook-core; if ($LASTEXITCODE) { throw 'cargo build failed' }; Pop-Location
          python work/build-apps.py windows 2>&1 | Tee-Object -FilePath windows.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content windows.log -Tail 15 | ForEach-Object { "::error title=Windows build::$($_ -replace '%','%25' -replace '\r','')" }
            throw "Windows build failed ($LASTEXITCODE)."
          }
          node work/run-tests.cjs provider-1125 --no-skip
          if ($LASTEXITCODE -ne 0) { throw 'Windows device-protection test failed.' }

      - name: Checksums and release notes
        shell: pwsh
        run: |
          $names = @("ThingsBook-Independent-$env:VERSION.exe", "ThingsBook-Android-$env:VERSION.apk")
          $files = Get-ChildItem outputs -File | Where-Object { $names -contains $_.Name }
          if (-not $files) { throw 'Nothing was built: no APK (signing secrets missing?) and no EXE.' }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content "outputs/ThingsBook-$env:VERSION-SHA256SUMS.txt" -Encoding utf8
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:VERSION)) — [^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (-not $section) { $section = 'See CHANGELOG.md.' }
          $notes = $section + "`n`n**Installing:** install the Android APK over the existing ThingsBook; do not uninstall first, which deletes the private on-device library. Update every device before moving a library with a new backup. Personal voices stay installed across updates; this public build does not carry a voice pack."
          if (-not (Test-Path "outputs/ThingsBook-Android-$env:VERSION.apk")) { $notes += "`n`nThis release has no Android APK: the signing secrets are not set." }
          if (-not (Test-Path "outputs/ThingsBook-Independent-$env:VERSION.exe")) { $notes += "`n`nThis release has no Windows EXE: its build failed (see the workflow run). Build it with python work/release.py on Windows." }
          Set-Content "$env:RUNNER_TEMP/release-notes.md" $notes -Encoding utf8
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("ThingsBook-Independent-$env:VERSION.exe", "ThingsBook-Android-$env:VERSION.apk", "ThingsBook-$env:VERSION-SHA256SUMS.txt") |
            ForEach-Object { Join-Path outputs $_ } | Where-Object { Test-Path $_ }
          gh release create "v$env:VERSION" @assets --target $env:GITHUB_SHA --title "ThingsBook $env:VERSION" --notes-file "$env:RUNNER_TEMP/release-notes.md"
