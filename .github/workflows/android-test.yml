# Builds "ThingsBook Test", a separate Android app (com.thingsbook.library.test) that installs next to the
# real ThingsBook and keeps its own library, so unreleased changes can be tried on a phone without the
# original signing key. It is signed with a throwaway test key kept in the Actions cache (never in git);
# if that cache expires, the next test build has a new key and the old test app must be uninstalled first.
# The APK is published as the "test-build" pre-release, replaced on every run.
# Run it from the Actions tab (Android test build > Run workflow) or with `gh workflow run android-test.yml`.
name: Android test build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test-build
  cancel-in-progress: true

jobs:
  test-apk:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Android SDK packages
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ANDROID_HOME\build-tools\35.0.0") -or -not (Test-Path "$env:ANDROID_HOME\platforms\android-35")) {
            $sdkmanager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
            (1..20 | ForEach-Object { 'y' }) | & $sdkmanager.FullName --sdk_root="$env:ANDROID_HOME" 'build-tools;35.0.0' 'platforms;android-35' | Out-Null
          }
      - name: Restore the test signing key
        id: key
        uses: actions/cache@v4
        with:
          path: test-signing
          key: thingsbook-android-test-key-v1
      - name: Create a test signing key
        if: steps.key.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-signing | Out-Null
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          [IO.File]::WriteAllText("$PWD\test-signing\password.txt", $password)
          & "$env:JAVA_HOME_17_X64\bin\keytool.exe" -genkeypair -keystore test-signing\thingsbook-release.jks -alias thingsbook `
            -storepass $password -keypass $password -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=ThingsBook Test build" -noprompt
          if ($LASTEXITCODE -ne 0) { throw 'keytool failed.' }
      - name: Build the test APK
        run: python work/build-apps.py android --test --jdk "${{ env.JAVA_HOME_17_X64 }}" --sdk "${{ env.ANDROID_HOME }}" --signing test-signing
      - name: Publish the test-build pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = Get-ChildItem outputs -Filter 'ThingsBook-Android-Test-*.apk' | Select-Object -First 1
          if (-not $apk) { throw 'Test APK not found.' }
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $notes = @"
          Test build of $env:GITHUB_REF_NAME at $sha, for trying unreleased changes on a phone.

          - Installs as a separate app, "ThingsBook Test", next to your real ThingsBook. It has its own, empty library: your real app and books are not touched.
          - Try it with a few sample books, not your only copies.
          - Signed with a test key, not your release key; it can never update the real app.
          - If installing says the app conflicts with an existing package, uninstall the old ThingsBook Test (not ThingsBook) and try again.
          "@
          gh release delete test-build --cleanup-tag --yes 2>$null
          gh release create test-build $apk.FullName --prerelease --target $env:GITHUB_SHA --title "ThingsBook Test build ($sha)" --notes $notes
